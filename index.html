<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduation Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica+SC&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scene">

    <div class="envelope-wrap" id="envelope">

        <!-- Envelope body -->
        <img 
            class="envelope-body"
            src="assets/envelope-body.svg"
        >


        <!-- Invitation card -->
        <img 
            id="card"
            class="card"
            src="assets/card.png"
        >


    <!-- Details after opening -->
    <div class="invitation-details" id="details">
    <h1 class= "invite-title">you are invited to my</h1>
    <p class="graduation-title">Graduation</p>
    <img class="pfp" src="assets/pfp.svg">
    <p>18 November 2026</p>
    <p>wednesday | 1.30PM</p>
    <p>dewan tunku canselor, university malaya</p>
    <button>Add to Calendar</button>
    </div>


        <!-- Opening flap -->
        <div class="flap" id="flap">

            <img 
                class="flap-img"
                src="assets/flap_full.svg"
            >

        </div>


    </div>


    <p class="instruction">
        Shake your phone to open
    </p>

    <button id="openBtn">
        or tap here
    </button>


</div>



<script src="script.js"></script>

</body>
</html>
